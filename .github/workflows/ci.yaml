---
name: OpenELP CI

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - devel
      - main
      - release/*

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ${{matrix.os}}
    # The bundled PCRE2 10.42 still declares cmake_minimum_required below
    # 3.5, which CMake 4 (on the macOS and Windows runners) rejects unless
    # this compatibility floor is provided.
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        build_type: [Release]
        include:
          - os: macos-latest
            test_target: test
            extra_flags: -Werror
          - os: ubuntu-latest
            test_target: test
            extra_flags: -Werror -Wformat-overflow -Wformat-security
          - os: windows-latest
            test_target: RUN_TESTS
            extra_flags: /WX
            extra_compiler_flags: >-
              /experimental:external
              /external:anglebrackets
              /external:W0

    steps:
      - name: Cache PCRE2
        uses: actions/cache@v4
        with:
          path: ${{runner.workspace}}/build/pcre-prefix/src/pcre2-10.42.tar.gz
          key: pcre2-10.42
      - name: Clone project
        uses: actions/checkout@v4
      - name: Get snapshot ID
        id: get-snap-id
        shell: bash
        run: echo "snap_id=git${{github.sha}}" | cut -c-19 >> $GITHUB_OUTPUT
      - name: Create build environment
        shell: bash
        working-directory: ${{runner.workspace}}
        run: mkdir -p build
      - name: Configure project
        working-directory: ${{runner.workspace}}/build
        run: >-
          cmake ${{github.workspace}}
          -Werror=dev
          -Wno-error=deprecated
          -DCMAKE_BUILD_TYPE=${{matrix.build_type}}
          -DBUILD_TESTING:BOOL=ON
          -DBUILD_SHARED_LIBS:BOOL=ON
          -DOPENELP_DOC_HTMLHELP:BOOL=OFF
          -DOPENELP_BUNDLE_PCRE:BOOL=ON
          -DOPENELP_USE_OPENSSL:BOOL=OFF
          -DCPACK_GENERATOR=ZIP
          -DCPACK_PACKAGE_FILE_NAME=OpenELP-${{runner.os}}
          -DCPACK_TOPLEVEL_TAG=${{runner.os}}
          -DOPENELP_EXTRA_VERSION=${{steps.get-snap-id.outputs.snap_id}}
          -DCMAKE_C_FLAGS="${{matrix.extra_flags}} ${{matrix.extra_compiler_flags}}"
          -DCMAKE_EXE_LINKER_FLAGS="${{matrix.extra_flags}}"
          -DCMAKE_SHARED_LINKER_FLAGS="${{matrix.extra_flags}}"
          -DCMAKE_STATIC_LINKER_FLAGS="${{matrix.extra_flags}}"
      - name: Build PCRE2
        run: >-
          cmake
          --build ${{runner.workspace}}/build
          --config ${{matrix.build_type}}
          -j2
          -t pcre
      - name: Build project
        run: >-
          cmake
          --build ${{runner.workspace}}/build
          --config ${{matrix.build_type}}
          -j2
      - name: Test project
        run: >-
          cmake
          --build ${{runner.workspace}}/build
          --config ${{matrix.build_type}}
          -j2
          -t ${{matrix.test_target}}
        if: ${{matrix.test_target}}
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
      - name: Package project
        run: >-
          cmake
          --build ${{runner.workspace}}/build
          --config ${{matrix.build_type}}
          -j2
          -t package
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: OpenELP-${{runner.os}}
          path: ${{runner.workspace}}/build/_CPack_Packages/${{runner.os}}/ZIP/OpenELP-${{runner.os}}/*

  build_documentation:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Install Prerequisites
        # The pinned Doxygen 1.9.7 binary is no longer hosted upstream, so
        # the job uses the distribution's Doxygen, which pulls in its own
        # matching libclang.
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          doxygen graphviz libpcre2-dev
      - name: Clone project
        uses: actions/checkout@v4
      - name: Create build environment
        shell: bash
        run: |
          mkdir -p ${{runner.workspace}}/build
          echo "WARN_AS_ERROR = FAIL_ON_WARNINGS" >> doc/Doxyfile.in
      - name: Configure project
        working-directory: ${{runner.workspace}}/build
        run: >-
          cmake ${{github.workspace}}
          -Werror=dev
          -Wno-error=deprecated
          -DBUILD_TESTING:BOOL=OFF
          -DBUILD_SHARED_LIBS:BOOL=OFF
          -DOPENELP_DOC_HTMLHELP:BOOL=OFF
          -DOPENELP_BUNDLE_PCRE:BOOL=OFF
          -DOPENELP_USE_OPENSSL:BOOL=OFF
          -DOPENELP_DOC_INTERNAL=ON
      - name: Build documentation
        run: >-
          cmake
          --build ${{runner.workspace}}/build
          -j2
          -t doc
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: OpenELP-HTML-Docs
          path: ${{runner.workspace}}/build/doc/html/*

  coverage:
    name: Code Coverage
    runs-on: ubuntu-22.04
    steps:
      - name: Install Prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcre2-dev
      - name: Clone project
        uses: actions/checkout@v4
      - name: Create build environment
        shell: bash
        working-directory: ${{runner.workspace}}
        run: mkdir -p build
      - name: Configure project
        working-directory: ${{runner.workspace}}/build
        run: >-
          cmake ${{github.workspace}}
          -Wno-dev
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING:BOOL=ON
          -DBUILD_SHARED_LIBS:BOOL=ON
          -DOPENELP_BUNDLE_PCRE:BOOL=OFF
          -DOPENELP_USE_OPENSSL:BOOL=OFF
          -DCMAKE_C_FLAGS="--coverage"
      - name: Build project
        run: >-
          cmake
          --build ${{runner.workspace}}/build
          --config Debug
          -j2
      - name: Test project
        run: >-
          cmake
          --build ${{runner.workspace}}/build
          --config Debug
          -j2
          -t test
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
      - name: Aggregate coverage
        run: >-
          find ${{runner.workspace}}/build -name '*.gcda' |
          xargs gcov -p -s ${{runner.workspace}}
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          directory: ${{github.workspace}}
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: ${{github.workspace}}
